name: Manual TCE2 release binaries
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version required in src/game/tce_version.h
        type: string
        default: '1.0.2'
        required: true
      include_editor:
        description: Also build separate local authoring modules and bot cores
        type: boolean
        default: true
      include_desktop:
        description: Also build standalone Windows NavStudio desktop application
        type: boolean
        default: true
      publish_release:
        description: Publish the complete validated bundle as a GitHub release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: manual-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate clean-checkout inputs and manual-only triggers
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python tools/release/validate.py source --expect-version "$EXPECTED_VERSION"
      - name: Plan all supported target families
        id: plan
        env:
          INCLUDE_EDITOR: ${{ inputs.include_editor }}
        run: python tools/release/plan.py
      - name: Check command registry and diagnostic filter regressions
        run: python -m unittest discover -s tools/release -p "test_*.py"
      - name: Package reproducible build sources
        run: python tools/release/source_archive.py --out out/source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TCE2-${{ steps.plan.outputs.version }}-Source
          path: out/source/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  binaries:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Use the official Ubuntu archive for package downloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          for path in (Path('/etc/apt/sources.list'), Path('/etc/apt/sources.list.d/ubuntu.sources')):
              if not path.is_file():
                  continue
              source = path.read_text(encoding='utf-8')
              updated = re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu/?(?=\s|$)',
                               'https://archive.ubuntu.com/ubuntu', source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  print('Replaced Azure Ubuntu archive in', path)
          PY
      - name: Install Linux compiler families
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ninja-build gcc g++
      - name: Install i386 multilib compiler
        if: matrix.target == 'linux-i386'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-multilib g++-multilib
      - name: Install ARMv7 cross compiler
        if: matrix.target == 'linux-armv7'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Install AArch64 cross compiler
        if: matrix.target == 'linux-aarch64'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Ensure macOS Ninja is available
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - name: Install pinned Android NDK
        if: startsWith(matrix.target, 'android-')
        shell: bash
        run: |
          android_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$android_root/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.3.13750724' >/dev/null
          echo "ANDROID_NDK_HOME=$android_root/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Install pinned Emscripten SDK
        if: matrix.target == 'wasm32'
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build/emsdk
          git -C build/emsdk checkout d7b4130688bfa348392b921ab04015aa15c4f154
          build/emsdk/emsdk install 3.1.74
          build/emsdk/emsdk activate 3.1.74
          echo "EMSDK=$GITHUB_WORKSPACE/build/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$GITHUB_WORKSPACE/build/emsdk/.emscripten" >> "$GITHUB_ENV"
      - name: Fetch checksum-pinned Boost headers
        run: python tools/release/bootstrap.py --destination build/dependencies
      - name: Build modules and matched gameplay/editor bot core
        run: python tools/release/build.py --target ${{ matrix.target }} --variant ${{ matrix.variant }} --build build/release --out out/release --boost build/dependencies/boost_1_85_0 --parallel 4
      - name: Validate target client inputs and runtime closure
        run: python tools/release/validate.py archives out/release
      - name: Upload ABI inputs and concrete build logs for aggregation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TCE2-${{ needs.plan.outputs.version }}-${{ matrix.target }}-${{ matrix.variant }}-Client-Inputs
          path: |
            out/release/*.zip
            out/release/*.sha256
            out/release/*.json
            out/release/*.log
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  navstudio-desktop:
    needs: plan
    if: inputs.include_desktop
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r navstudio/requirements-desktop.txt
      - name: Build pinned Recast geometry worker
        run: |
          cmake -S . -B build/desktop -A x64 -DBUILD_TESTING=OFF -DFEATURE_OMNIBOT=OFF -DTCE_BUILD_OMNIBOT_CORE=OFF -DTCE_BUILD_NAVMESH_TOOL=ON
          cmake --build build/desktop/navmesh --config Release --target tce_navmesh_preview --parallel 4
      - name: Freeze standalone NavStudio and validate resource closure
        shell: pwsh
        run: |
          ./navstudio/build-windows.ps1 -RecastExecutable build/desktop/navmesh/Release/tce_navmesh_preview.exe -RecastLicense build/desktop/_deps/recast-src/License.txt -Destination build/desktop-app
          python tools/release/desktop_archive.py --package build/desktop-app/TCE2-NavStudio --out out/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TCE2-${{ needs.plan.outputs.version }}-NavStudio-Desktop-Windows-x64
          path: out/desktop/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  aggregate:
    needs: [plan, binaries, navstudio-desktop]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: TCE2-${{ needs.plan.outputs.version }}-*
          path: collected
      - name: Assemble canonical clients and installable target ZIPs with build status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/release/aggregate.py --input collected --out out/complete
      - name: Validate actual complete Game and Editor archives and shared client provenance
        if: inputs.include_editor
        run: python tools/release/closure_report.py release --directory out/complete --out out/closure/release-closure.json
      - name: Small source-bound release closure evidence
        if: inputs.include_editor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TCE2-${{ needs.plan.outputs.version }}-Release-Closure
          path: out/closure/release-closure.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: TCE2-${{ needs.plan.outputs.version }}-Complete-Release
          path: |
            out/complete/*.zip
            out/complete/*.sha256
            out/complete/*.json
            out/complete/*.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  publish:
    needs: [plan, aggregate]
    if: inputs.publish_release && needs.aggregate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: TCE2-${{ needs.plan.outputs.version }}-Complete-Release
          path: release
      - name: Publish only the explicitly requested complete bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "TCE2 $RELEASE_VERSION" --notes-file release/release-notes.md release/*.zip release/*.sha256 release/release-manifest.json
